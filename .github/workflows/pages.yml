name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish only the site files, not the README or repo tooling
      - name: Assemble site
        run: |
          mkdir _site
          cp -R index.html .nojekyll css js assets _site/

      # GitHub Pages lets browsers cache CSS/JS for 4 hours, so append a
      # content hash to each reference; a changed file gets a new URL.
      - name: Fingerprint CSS and JS
        run: |
          for f in css/styles.css js/main.js; do
            hash=$(sha256sum "$f" | cut -c1-10)
            sed -i "s#\"$f\"#\"$f?v=$hash\"#" _site/index.html
            grep -q "$f?v=$hash" _site/index.html || { echo "::error::no reference to $f in index.html"; exit 1; }
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
