name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish only the site files, not the README or repo tooling
      - name: Assemble site
        run: |
          mkdir _site
          cp -R *.html .nojekyll css js assets _site/

      # GitHub Pages lets browsers cache CSS/JS for 4 hours, so append a
      # content hash to each reference; a changed file gets a new URL.
      - name: Fingerprint CSS and JS
        run: |
          for f in css/styles.css js/main.js; do
            hash=$(sha256sum "$f" | cut -c1-10)
            for page in _site/*.html; do
              sed -i "s#\"$f\"#\"$f?v=$hash\"#" "$page"
              grep -q "$f?v=$hash" "$page" || { echo "::error::no reference to $f in $page"; exit 1; }
            done
          done

      # This deployment is the client preview, so keep it out of search
      # engines. A robots meta tag rather than a robots.txt Disallow: a
      # blocked crawler never fetches the page, so it can't see noindex and
      # may still list the bare URL if something links to it. Drop this step
      # for a production deployment.
      - name: Mark pages noindex
        run: |
          for page in _site/*.html; do
            sed -i 's#</head>#<meta name="robots" content="noindex, nofollow">\n</head>#' "$page"
            grep -q 'name="robots" content="noindex' "$page" || { echo "::error::no robots meta in $page"; exit 1; }
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
